<!DOCTYPE html>
<html lang="en" data-theme="dark" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Back — Login to DashRides</title>
  <meta name="description" content="Sign in to your DashRides account to manage your electric scooter subscriptions, fast charging swaps, and telemetry passes.">
  <link rel="icon" type="image/svg+xml" href="../favicon.svg">
  <link rel="shortcut icon" href="../favicon.svg">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/reset.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
  <link rel="stylesheet" href="../css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <a href="#main-content" class="skip-to-content">Skip to main content</a>

  <!-- Auth Topbar - Toggles Right Corner Only -->
  <div class="auth-topbar" style="position: fixed; top: 1.25rem; right: 1.5rem; display: flex; align-items: center; gap: 0.6rem; z-index: 100;">
    <button class="theme-toggle" aria-label="Toggle dark and light theme">
      <i class="fa-solid fa-sun theme-icon-sun"></i>
      <i class="fa-solid fa-moon theme-icon-moon"></i>
    </button>
    <button class="rtl-toggle" aria-label="Toggle text direction">
      <span>RTL</span>
    </button>
  </div>

  <main id="main-content">
    <section class="auth-page-section">
      <div class="auth-card-wrapper">
        <div class="auth-card reveal-scale">
          <!-- Card Header / Brand -->
          <div class="auth-header">
            <a href="../index.html" class="auth-brand" aria-label="DashRides Home">
              <div class="logo-icon">
                <svg viewBox="0 0 32 32" width="22" height="22" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M17.8 2.8L8.2 14.6H13.1L10.2 26.2L22.6 13.6H17.4L20.1 2.8Z" fill="white" stroke="white" stroke-width="0.45" stroke-linejoin="round"/>
                  <g stroke="white" stroke-linecap="round" opacity="0.92">
                    <path d="M4.6 10.2H8.1" stroke-width="1.55"/>
                    <path d="M3 16H7.8" stroke-width="1.65"/>
                    <path d="M4.9 21.8H8.4" stroke-width="1.5" opacity="0.78"/>
                  </g>
                </svg>
              </div>
              <div class="logo-text">
                <span class="logo-brand"><span>DASH</span>RIDES</span>
                <span class="logo-tagline">ELECTRIC MOBILITY</span>
              </div>
            </a>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your rider dashboard &amp; fleet pass</p>
          </div>

          <!-- Login Form -->
          <form class="auth-form" id="login-form" novalidate>
            <div class="form-group">
              <label class="form-label" for="login-email">Email Address</label>
              <input type="email" id="login-email" name="email" class="form-control" placeholder="rider@example.com" required autocomplete="email">
              <span class="form-error">Please enter a valid email address</span>
            </div>

            <div class="form-group">
              <label class="form-label" for="login-password">Password</label>
              <div class="password-wrapper">
                <input type="password" id="login-password" name="password" class="form-control" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="pwd-toggle-btn" aria-label="Toggle password visibility" onclick="togglePasswordVisibility('login-password', this)">
                  <i class="fa-regular fa-eye"></i>
                </button>
              </div>
              <span class="form-error">Please enter your password</span>
            </div>

            <div class="auth-row-options">
              <label class="checkbox-label" for="remember-me">
                <input type="checkbox" id="remember-me" name="remember">
                <span>Remember me</span>
              </label>
              <a href="#" class="forgot-link" onclick="handleForgotPassword(event)">Forgot password?</a>
            </div>

            <button type="submit" class="auth-submit-btn" id="login-submit-btn">
              <span>Sign In</span>
            </button>
          </form>

          <!-- Divider -->
          <div class="auth-divider">
            <span>or continue with</span>
          </div>

          <!-- Social Login Buttons -->
          <div class="auth-social-grid">
            <button type="button" class="btn-social" onclick="handleSocialAuth('Google')">
              <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.34 24 12 24z"/>
                <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.34 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
              </svg>
              <span>Google</span>
            </button>
            <button type="button" class="btn-social" onclick="handleSocialAuth('Facebook')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#1877F2" aria-hidden="true">
                <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
              </svg>
              <span>Facebook</span>
            </button>
          </div>

          <!-- Switch to Signup -->
          <div class="auth-footer-text">
            Don't have an account? <a href="signup.html">Sign Up</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="../js/main.js"></script>
  <script src="../js/scroll-reveal.js"></script>
  <script>
    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    function handleForgotPassword(e) {
      e.preventDefault();
      const emailInput = document.getElementById('login-email');
      if (emailInput && emailInput.value && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailInput.value)) {
        showToast('Password reset link sent to ' + emailInput.value, 'success');
      } else {
        showToast('Password reset link sent! Please check your inbox.', 'info');
      }
    }

    function handleSocialAuth(provider) {
      showToast('Connecting to ' + provider + ' authentication...', 'info');
      setTimeout(() => {
        showToast('Successfully authenticated with ' + provider + '! Redirecting...', 'success');
        setTimeout(() => window.location.href = 'dashboard.html', 1000);
      }, 800);
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const form = this;
      let valid = true;

      const email = document.getElementById('login-email');
      const pass = document.getElementById('login-password');

      if (!email.value.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
        valid = false;
        email.closest('.form-group').classList.add('has-error');
      } else {
        email.closest('.form-group').classList.remove('has-error');
      }

      if (!pass.value.trim()) {
        valid = false;
        pass.closest('.form-group').classList.add('has-error');
      } else {
        pass.closest('.form-group').classList.remove('has-error');
      }

      if (!valid) {
        showToast('Please fill in all required fields properly', 'error');
        return;
      }

      const btn = document.getElementById('login-submit-btn');
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>Signing In...</span>';

      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
        showToast('Welcome back, rider! Redirecting to dashboard...', 'success');
        form.reset();
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1000);
      }, 900);
    });
  </script>
</body>
</html>
